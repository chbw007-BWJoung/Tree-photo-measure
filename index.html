<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>사진 수목측정</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#111111" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="사진 수목측정" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>
<body style="margin:0;background:#111;color:#fff">
  <div id="root">
    <p style="padding:20px;font-family:sans-serif">앱을 불러오는 중…</p>
  </div>
  <script>
    window.addEventListener('error', function (e) {
      var r = document.getElementById('root');
      if (r && !r.dataset.rendered) r.innerHTML = '<div style="padding:20px;font-family:sans-serif"><h3>⚠️ 오류</h3><pre style="white-space:pre-wrap;color:#fca5a5">' + String(e.message || e.error).replace(/</g, '&lt;') + '</pre></div>';
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
